<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kho học liệu số Tin học</title>
    <meta name="description" content="Một ứng dụng hiện đại dùng để lưu trữ, quản lý, lọc và chia sẻ các liên kết (URL) thông minh." />
    <meta property="og:title" content="Kho học liệu số Tin học" />
    <meta property="og:description" content="Một ứng dụng hiện đại dùng để lưu trữ, quản lý, lọc và chia sẻ các liên kết (URL) thông minh." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght=400;500;600&family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedSettings = localStorage.getItem('link_manager_settings');
          if (savedSettings) {
            var parsed = JSON.parse(savedSettings);
            if (parsed.theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
